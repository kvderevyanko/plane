project:
  name: LR1600
  units: mm

wing:
  span: 1600
  root_chord: 250
  tip_chord: 200
  airfoil: clark_y
  washout_deg: -1.5
  dihedral_deg: 2.0
  twist_axis_fraction: 0.25
  rib_pitch_mm: 100
  aileron_span_mm: 500
  aileron_chord_mm: 48
  aileron_inboard_offset_mm: 150

spar:
  type: carbon_tube
  outer_diameter: 14
  inner_diameter: 12
  chord_position: 0.30
  hole_clearance_mm: 0.25

materials:
  skin_foam_mm: 3
  rib_foam_mm: 5
  root_rib_plywood_mm: 2.0
  plywood_structural_mm:
    - 2.0
    - 3.0

aircraft:
  target_mass_g: 2400
  design_load_factor_g: 4.0
  gravity_m_s2: 9.80665

# The aircraft reference system applies to every future layout, mass item, and
# CG result.  All coordinates are relative to the root-wing leading edge.
layout:
  coordinate_system:
    datum: wing_root_leading_edge
    x_positive: aft
    y_positive: right
    z_positive: up
    length_unit: mm
    mass_unit: g

# This is intentionally not a first-flight CG approval.  The numerical
# initial/design envelope remains undefined until the tail and stability inputs
# listed in docs/cg-reference.md exist.
cg:
  initial_envelope:
    status: initial_design_assumption
    x_mac_fraction_min: 0.24
    x_mac_fraction_max: 0.28
    basis: preliminary tail-stability-v1 sensitivity; not a measured aircraft CG or first-flight release
  first_flight_recommendation:
    status: preliminary_recommendation
    x_mac_fraction: 0.25
    basis: preliminary tail-stability-v1 conservative point inside the design envelope; requires measured all-up CG before flight

# Preliminary stability integration only.  These values are intentionally
# separated from the immutable wing definition and are not manufacturing data.
tail:
  status: initial_design_assumption
  tail_arm_mm: 650.0
  horizontal:
    span_mm: 700.0
    root_chord_mm: 90.0
    tip_chord_mm: 90.0
    elevator_chord_fraction: 0.40
  vertical:
    fin_height_mm: 230.0
    root_chord_mm: 135.0
    tip_chord_mm: 96.17
    rudder_chord_fraction: 0.30

# Twin-boom reference axes are selected for stability/clearance integration;
# the actual tube section and mass remain design-estimate/TBD until sourced.
booms:
  status: initial_design_assumption
  lateral_offset_mm: 230.0
  axis_z_mm: 0.0
  section_candidate:
    status: tbd
    outer_diameter_mm: null
    inner_diameter_mm: null

# Planned aircraft-level mass ledger.  `tbd` is deliberate: no unmeasured mass
# or location may be invented merely to produce an apparent aircraft CG.
