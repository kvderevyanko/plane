project:
  name: LR1600
  units: mm

wing:
  span: 1600
  root_chord: 250
  tip_chord: 200
  airfoil: clark_y
  washout_deg: -1.5
  dihedral_deg: 2.0
  twist_axis_fraction: 0.25
  rib_pitch_mm: 100
  aileron_span_mm: 500
  aileron_chord_mm: 48
  aileron_inboard_offset_mm: 150

spar:
  type: carbon_tube
  outer_diameter: 14
  inner_diameter: 12
  chord_position: 0.30
  hole_clearance_mm: 0.25

materials:
  skin_foam_mm: 3
  rib_foam_mm: 5
  root_rib_plywood_mm: 2.0
  plywood_structural_mm:
    - 2.0
    - 3.0

aircraft:
  # Preliminary integration/design mass case; not a flight-release MTOW.
  target_mass_g: 2600
  design_load_factor_g: 4.0
  gravity_m_s2: 9.80665

# The aircraft reference system applies to every future layout, mass item, and
# CG result.  All coordinates are relative to the root-wing leading edge.
layout:
  coordinate_system:
    datum: wing_root_leading_edge
    x_positive: aft
    y_positive: right
    z_positive: up
    length_unit: mm
    mass_unit: g

# This is intentionally not a first-flight CG approval.  The numerical
# initial/design envelope remains undefined until the tail and stability inputs
# listed in docs/cg-reference.md exist.
cg:
  initial_envelope:
    status: initial_design_assumption
    x_mac_fraction_min: 0.24
    x_mac_fraction_max: 0.28
    basis: preliminary tail-stability-v1 sensitivity; not a measured aircraft CG or first-flight release
  first_flight_recommendation:
    status: preliminary_recommendation
    x_mac_fraction: 0.25
    basis: preliminary tail-stability-v1 conservative point inside the design envelope; requires measured all-up CG before flight

# Preliminary stability integration only.  These values are intentionally
# separated from the immutable wing definition and are not manufacturing data.
tail:
  status: initial_design_assumption
  tail_arm_mm: 650.0
  horizontal:
    span_mm: 700.0
    root_chord_mm: 90.0
    tip_chord_mm: 90.0
    elevator_chord_fraction: 0.40
  vertical:
    fin_height_mm: 230.0
    root_chord_mm: 135.0
    tip_chord_mm: 96.17
    rudder_chord_fraction: 0.30

# Twin-boom reference axes are selected for stability/clearance integration;
# the actual tube section and mass remain design-estimate/TBD until sourced.
booms:
  status: initial_design_assumption
  lateral_offset_mm: 230.0
  axis_z_mm: 0.0
  section_candidate:
    status: tbd
    outer_diameter_mm: null
    inner_diameter_mm: null

# Preliminary powertrain architecture. Envelopes are requirements and simple
# installation volumes, never a commercial motor/ESC/propeller selection.
propulsion:
  status: initial_design_assumption
  nominal_series_count: 6
  propeller:
    diameter_min_mm: 330.2
    diameter_max_mm: 355.6
    pitch_min_mm: 228.6
    pitch_max_mm: 254.0
    cruise_rpm_min: 4500.0
    cruise_rpm_max: 9000.0
  motor:
    kv_min_rpm_per_v: 365.0
    kv_max_rpm_per_v: 570.0
    continuous_electrical_power_w: 550.0
    peak_electrical_power_w: 700.0
    continuous_current_a: 35.0
    peak_current_a: 45.0
    mass_min_g: 120.0
    mass_max_g: 180.0
    envelope_length_mm: 70.0
    envelope_diameter_mm: 50.0
  esc:
    # Mirror of the current preliminary hardware manifest installation box.
    length_mm: 73.0
    width_mm: 30.0
    height_mm: 12.0
    x_mm: 285.0
    y_mm: 42.0
    z_mm: 5.0
  propeller_plane_x_mm: 430.0
  motor_cg_x_mm: 395.0
  motor_axis_z_mm: 50.0

# Propulsion and avionics rails are intentionally independent. Values are
# preliminary electrical requirements, not a selected ESC/BEC or pack curve.
electrical:
  status: initial_design_assumption
  propulsion_bus_nominal_voltage_v: 22.2
  propulsion_bus_loaded_min_voltage_v: 21.0
  avionics_logic_rail_v: 5.0
  servo_rail_v: 6.0
  hotel_load_low_w: 7.0
  hotel_load_nominal_w: 16.0
  hotel_load_high_w: 25.0

# Battery data reserves a removable-pack envelope. The Li-ion direction is
# conditional on verified cells/parallel-count sag and peak-current evidence.
battery:
  status: initial_design_assumption
  chemistry_direction: li_ion_preliminary
  # P60B 6S1P preliminary branch: 129.6 Wh nominal, 103.7 Wh study usable,
  # 503 g complete-pack estimate. The physical pack/tray remains a design
  # estimate until the actual build is weighed and its removal route is proven.
  usable_energy_preferred_min_wh: 103.7
  usable_energy_preferred_max_wh: 103.7
  mass_min_g: 490.0
  mass_max_g: 520.0
  package_length_mm: 155.0
  package_width_mm: 75.0
  package_height_mm: 28.0
  # Preliminary ledger solution, not an installation clearance pass: a long
  # forward bay is deliberately retained to close the 24--28% MAC study.
  nominal_x_mm: -370.0
  x_adjustment_min_mm: -387.5
  x_adjustment_max_mm: -332.5
  y_mm: 0.0
  z_mm: 0.0
  tray_status: preliminary_design_assumption

# Rough-field tricycle reference and pusher ground-clearance screen.  This is
# an installation envelope only: it does not select a landing-gear part or
# define an external fuselage skin/load path.  The 13-in baseline and 65-mm
# dynamic tip margin come from the mission-rebaseline aero integration study.
ground_operations:
  status: initial_design_assumption
  propeller_diameter_mm: 330.2
  dynamic_tip_clearance_goal_mm: 65.0
  static_propeller_axis_height_mm: 322.5
  main_wheel_diameter_mm: 105.0
  nose_wheel_diameter_mm: 75.0
  main_wheel_x_mm: 125.0
  nose_wheel_x_mm: -250.0
  main_track_mm: 350.0
  rotation_tail_down_deg: 8.0
  compressed_tip_clearance_mm: 139.4
  rotation_tip_clearance_mm: 96.9
  rough_tip_clearance_mm: 66.9
  hardpoint_z_mm: -60.0
  nose_architecture:
    heading: fixed_longitudinal
    anti_rotation: positive_mechanical_index
    compliance: replaceable_sprung_strut_fork
    seasonal_axle_interface: wheel_or_pitch_pivot_ski
    yaw_freedom: locked

# Preliminary real fuselage/package architecture. This is the source for the
# reference master-layout only; it is not production skin or laser geometry.
fuselage_integration:
  status: initial_design_assumption
  outer_x_min_mm: -500.0
  outer_x_max_mm: 410.0
  maximum_width_mm: 180.0
  maximum_height_mm: 190.0
  center_z_mm: 0.0
  # The forward bay is intentionally open between its hatch perimeter rings:
  # do not add a full-width former there in production CAD.
  bulkhead_x_mm: [-485.0, -235.0, -55.0, 65.0, 130.0, 200.0, 285.0, 365.0]
  hardpoint_bulkhead_x_mm: [-55.0, 65.0, 130.0, 200.0, 285.0, 365.0]
  battery_hatch_x_mm: -357.5
  battery_hatch_length_mm: 230.0
  battery_hatch_width_mm: 125.0
  battery_hatch_z_mm: 95.0
  boom_interface_x_mm: 285.0
  boom_clamp_rear_x_mm: 365.0
  motor_mount_x_mm: 410.0
  forward_servos:
    - id: elevator_servo
      x_mm: 110.0
      y_mm: 0.0
      z_mm: -15.0
    - id: rudder_servo_left
      x_mm: 110.0
      y_mm: -32.0
      z_mm: -15.0
    - id: rudder_servo_right
      x_mm: 110.0
      y_mm: 32.0
      z_mm: -15.0

# Nominal prototype-v1 primary skeleton.  CAD derives all individual laser
# outlines from this contract; measured plywood thickness and laser kerf remain
# downstream process settings.  It does not alter wing/tail/boom aerodynamics.
fuselage_prototype:
  status: prototype_v1
  stations_x_mm: [-285.0, -170.0, -55.0, 65.0, 130.0, 200.0, 285.0, 365.0]
  inner_width_mm: 140.0
  lower_keel_z_mm: -70.0
  upper_longeron_z_mm: 62.0
  longeron_width_mm: 5.0
  longeron_height_mm: 3.0
  # Usable pack-centre range.  -387.5 extends the former rail forward by
  # 5 mm and clears the preliminary 24% MAC requirement.
  battery_rail_x_min_mm: -387.5
  battery_rail_x_max_mm: -332.5
  battery_rail_y_mm: 0.0
  battery_rail_spacing_mm: 90.0
  main_gear_box_x_min_mm: 65.0
  main_gear_box_x_max_mm: 200.0
  boom_clamp_spacing_mm: 80.0
  boom_saddle_diameter_mm: 20.0
  motor_plate_width_mm: 110.0
  motor_plate_height_mm: 90.0
  nose_index_key_width_mm: 12.0

# Forward-mounted tail-actuation route study.  The lines in master-layout are
# only routes between known reference stations; end fittings, guides, control
# horns, stiffness/backlash and production attachment geometry remain gates.
linkage_reference:
  status: initial_design_assumption
  servo_x_mm: 110.0
  carbon_rod_outer_diameter_mm: 3.0
  carbon_rod_inner_diameter_mm: 1.0
  elevator_route_length_mm: 610.0
  rudder_route_length_mm: 720.0
  maximum_guide_spacing_mm: 150.0

# Display/package envelopes mirror the current preliminary hardware manifest
